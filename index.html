async function api(o,ms){const c=D.cfg;if(!okUrl(c.url))throw new Error('the web app link must start with https://script.google.com/macros/s/ and end with /exec');
const ac=new AbortController(),t=ms||30000,tm=setTimeout(()=>ac.abort(),t);let r;
try{r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:c.token,...o}),signal:ac.signal,referrerPolicy:'no-referrer'})}
catch(e){throw new Error(e.name==='AbortError'?'no reply from Google after '+Math.round(t/1000)+' seconds':navigator.onLine===false?'you are offline':'could not reach Google ('+e.message+')')}finally{clearTimeout(tm)}
const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){throw new Error(/<html/i.test(tx)?'Google sent a web page instead of data. Check the web app link and that access is set to Anyone':'unreadable reply from Google')}
if(j&&j.error)throw new Error(j.error);return j}
function evs(){const o=[];live('acca').filter(p=>p.st==='Booked'&&p.date).forEach(p=>o.push({key:'acca-'+p.c,date:p.date,title:'ACCA '+p.c+' exam'}));
live('goal').filter(g=>g.due&&+g.pct<100).forEach(g=>o.push({key:'goal-'+g.id,date:g.due,title:'Goal due: '+g.title}));return o}
async function sync(manual){if(busy||(UP&&!manual))return;busy=1;try{await sync0(manual)}finally{busy=0}}
async function sync0(manual){const c=D.cfg;if(!c.url){if(manual)msg('Paste your web app link first.');return}
msg('Syncing…');sy('Syncing…','busy');try{const j=await api({items:D.items,events:c.cal?evs():undefined},60000);
merge(j.items);if(j.bk)c.bk=j.bk;c.sv=j.v||0;setTimeout(upFiles,500);c.fails=0;c.lastErr='';c.lastAt=Date.now();if(c.cal&&j.cal&&j.cal!=='ok')logE('calendar',j.cal);await save();render();syIdle();
msg('Synced '+new Date().toLocaleString('en-GB')+(c.cal?(j.cal==='ok'?' · calendar updated':' · calendar problem: '+j.cal):''))}
catch(e){c.fails=(c.fails||0)+1;c.lastErr=e.message;logE('sync',e);save();sy('Sync failed','err');msg('Sync failed: '+e.message+'. Your data is safe on this device.')}}

// ---------- settings ----------
function openSettings(){const c=D.cfg,d=$('#st'),y=d.open?d.scrollTop:0,lg=LOG.slice(0,LOGALL?100:4);
$('#stc').innerHTML=`<h2>Settings</h2>
<h3>Connection</h3>
<label class="f"><span>Web app link</span><input id="s_url" value="${E(c.url||'')}" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url" autocomplete="off" spellcheck="false"></label>
<label class="f"><span>Secret word (same as in Code.gs)</span><div class="pw"><input id="s_tok" type="password" value="${E(c.token||'')}" autocomplete="off" spellcheck="false" autocapitalize="off"><button type="button" class="eye" aria-label="Show" aria-pressed="false" onclick="pwT(this)">${EYEI}</button></div></label>
${c.token&&c.token.length<16?'<p class="m" style="color:var(--amb)">Your secret word is short. Someone who finds your web app link could guess it.</p>':''}
<div class="btns" style="margin-top:12px"><button class="btn pri" onclick="saveConn()">Save &amp; connect</button><button class="btn" onclick="diag()" ${c.url?'':'disabled'}>Run checks</button><button class="btn sm" onclick="mkTok()">🔑 Make a strong secret word</button></div>
<div id="diagOut"></div>
<h3>Sync</h3><p class="m" id="msg">${c.url?(c.lastAt?'Last synced '+ago(c.lastAt):'Not synced yet')+(c.fails&&c.lastErr?' · '+E(c.lastErr):''):'Not connected. Everything stays on this device until you connect.'}</p>
<div class="btns"><button class="btn sm" onclick="sync(1).then(openSettings)" ${c.url?'':'disabled'}>↻ Sync now</button></div>
<label class="switch"><span>Add exams and goal due dates to Google Calendar</span><input type="checkbox" ${c.cal?'checked':''} onchange="D.cfg.cal=this.checked;save();sync(1)"></label>
<p class="m">They go to a “Career” calendar with alerts 7 days and 1 day before.</p>
<h3>Flow</h3><p class="m">${FLOW?(FLOW.src==='google'?'Linked through Google':'Linked on this device')+': '+FLOW.n+' ACCA paper'+(FLOW.n===1?'':'s')+', '+num(FLOW.all/60)+' h of study logged.':c.flowOff?'Flow link is off.':'Flow not linked yet.'} NextRole only reads Flow; it never changes it.</p>
<p class="m">Same browser as Flow: works by itself. iPhone/iPad home-screen apps and other devices: link through Google once on each device. Copy the two values from <b>Flow › Settings</b>.</p>
<label class="f"><span>Flow Web App URL</span><input id="f_url" value="${E(c.flowUrl||'')}" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url" autocomplete="off" spellcheck="false"></label>
<label class="f"><span>Flow App key</span><div class="pw"><input id="f_key" type="password" value="${E(c.flowKey||'')}" autocomplete="off" spellcheck="false" autocapitalize="off"><button type="button" class="eye" aria-label="Show" aria-pressed="false" onclick="pwT(this)">${EYEI}</button></div></label>
<div class="btns" style="margin-top:12px"><button class="btn sm pri" onclick="saveFlowLink()">${c.flowUrl?'Save &amp; refresh':'Link Flow'}</button>${c.flowUrl?'<button class="btn sm" onclick="flowPull(1).then(openSettings)">↻ Refresh now</button>':''}</div>
${c.flowUrl?`<p class="m">${c.flowErr?'<span class="s2">Last try failed: '+E(c.flowErr)+'</span>':c.flowAt?'Read from Flow '+ago(c.flowAt)+'. Refreshes every 15 minutes while open.':'Not read yet.'}</p>`:''}
<label class="switch"><span>Use Flow study data</span><input type="checkbox" ${c.flowOff?'':'checked'} onchange="D.cfg.flowOff=this.checked?0:1;FLD=1;save();render();openSettings()"></label>
<label class="switch"><span>Count Flow study in learning hours</span><input type="checkbox" ${c.flowHrs===0?'':'checked'} onchange="D.cfg.flowHrs=this.checked?1:0;save();render()"></label>
<h3>Learning</h3><label class="switch"><span>Count attended classes in learning hours</span><input type="checkbox" ${c.clsHrs===0?'':'checked'} onchange="D.cfg.clsHrs=this.checked?1:0;save();render()"></label><label class="f"><span>Yearly learning target (hours)</span><input type="number" inputmode="numeric" min="1" value="${+c.cpdT||40}" onchange="D.cfg.cpdT=Math.max(1,+this.value||40);save();render()"></label>
<p class="m">ACCA members need 40 units a year, 21 of them verifiable.</p>
<h3>Backup &amp; recovery</h3>
<p class="m">Your records live on this device, in your Google Sheet when connected, and in daily Drive backups (last 40 kept).</p>
<div class="r"><span class="m">Daily Drive backup</span><b>${c.url?(c.bk?fd(c.bk):'After the next sync'):'Needs sync'}</b></div><div class="r"><span class="m">Last backup file</span><b>${c.lastExport?fd(c.lastExport):'Never'}</b></div><div class="r"><span class="m">Records</span><b>${D.items.filter(i=>!i.deleted).length}</b></div>
<div class="btns mt"><button class="btn sm" onclick="exp()">⬇ Export file</button><button class="btn sm" onclick="$('#imp').click()">⬆ Import file</button><button class="btn sm" onclick="rbList()" ${c.url?'':'disabled'}>☁ Restore from Drive</button></div>
<div id="rbOut"></div>
<h3>Logs</h3><p class="m">${LOG.length?LOG.length+' problem'+(LOG.length>1?'s':'')+' recorded on this device. Script errors also go to the Log tab of your Google Sheet.':'No problems recorded. 👍'}</p>
${lg.map(x=>`<div class="logline">${new Date(x.t).toLocaleString('en-GB')} · ${E(x.a)} · ${E(x.m)}</div>`).join('')}
${LOG.length>4?`<button class="btn sm mt" onclick="LOGALL=!LOGALL;openSettings()">${LOGALL?'Show less':'Show all'}</button>`:''}${LOG.length?' <button class="btn sm mt" onclick="LOG=[];kv(\'put\',\'log\',[]);openSettings()">Clear</button>':''}
<h3>About</h3><p class="m">NextRole ${APP_V}${c.sv?' · script v'+c.sv+(c.sv<CODE_V?' (update Code.gs)':''):''}</p>
<div class="btns" style="margin-top:20px"><button class="btn" style="flex:1" onclick="$('#st').close()">Close</button></div>`;
if(!d.open){d.showModal();pushTab()}d.scrollTop=y}
async function saveConn(){const u=$('#s_url').value.trim(),t=$('#s_tok').value.trim();if(u&&!okUrl(u))return alert('That link does not look right. It should start with https://script.google.com/macros/s/ and end with /exec');
D.cfg.url=u;D.cfg.token=t;D.cfg.fails=0;D.cfg.lastErr='';await save();syIdle();openSettings();if(u)await sync(1);openSettings()}
const EYEI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
EYEO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
// show / hide a secret field
function pwSet(b,on){const i=b.parentNode.querySelector('input');i.type=on?'text':'password';b.innerHTML=on?EYEO:EYEI;b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Hide':'Show')}
function pwT(b){const i=b.parentNode.querySelector('input'),on=i.type==='password';pwSet(b,on);i.focus({preventScroll:true});try{const n=i.value.length;i.setSelectionRange(n,n)}catch(e){}}
function mkTok(){const a=new Uint8Array(18);crypto.getRandomValues(a);const t=btoa(String.fromCharCode(...a)).replace(/[+/=]/g,'').slice(0,24);$('#s_tok').value=t;pwSet($('#s_tok').parentNode.querySelector('.eye'),1);
navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Copied. Paste it into TOKEN in Code.gs')).catch(()=>{})}
async function diag(){const o=$('#diagOut');o.innerHTML='<p class="m">Checking…</p>';try{const h=await api({action:'health'}),ok=(b,t)=>`<div class="r"><span>${b?'✅':'⚠️'} ${t}</span></div>`;
o.innerHTML='<div class="c">'+ok(1,'Connected · script v'+h.v+(h.v<CODE_V?' (newer Code.gs available)':''))+ok(1,'Sheet: <a href="'+E(h.sheet.url)+'" target="_blank" rel="noopener" style="color:var(--cy)">'+E(h.sheet.name)+'</a> · '+h.sheet.rows+' rows')+
ok(!!h.backups,'Drive backups'+(h.backups?' · last '+E(h.backups.last||'—'):' · after first sync'))+ok(!D.cfg.cal||h.calendar,'Calendar'+(D.cfg.cal?(h.calendar?' ready':' not created yet'):' off'))+ok(!h.errors,h.errors?h.errors+' errors in the Log tab':'No script errors')+'</div>'}
catch(e){o.innerHTML='<p class="m s2">Check failed: '+E(e.message)+'</p>'}}
async function rbList(){const o=$('#rbOut');o.innerHTML='<p class="m">Loading backups…</p>';try{const j=await api({action:'backups'});
o.innerHTML=j.backups.length?'<div class="c">'+j.backups.map(b=>`<div class="pc" onclick="rbGet('${E(b.fid)}','${E(b.name)}')"><div style="flex:1">${E(b.name.replace('ladder-backup-','').replace('.json',''))}</div><span class="m">${Math.round(b.size/1024)} KB</span></div>`).join('')+'</div>':'<p class="m">No backups yet.</p>'}catch(e){o.innerHTML='<p class="m s2">'+E(e.message)+'</p>'}}
async function rbGet(fid,name){if(!confirm('Restore records from '+name+'? They will replace the current versions. A safety backup is made first.'))return;
try{await api({action:'snap'});const j=await api({action:'getbackup',fid}),b=JSON.parse(j.data),now=Date.now();merge((b.items||[]).map(i=>({...i,updated:now})));await save();render();await sync(1);openSettings();toast('Restored '+(b.items||[]).length+' records')}
catch(e){alert('Could not restore: '+e.message)}}
async function exp(){const b=new Blob([JSON.stringify({v:1,app:'Ladder',items:D.items})],{type:'application/json'}),f=new File([b],'ladder-backup-'+today()+'.json',{type:'application/json'});
const okx=()=>{D.cfg.lastExport=today();save();toast('Backup file ready')};try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});okx();return}}catch(e){if(e.name==='AbortError')return;logE('export',e)}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();okx()}
async function imp(inp){const f=inp.files[0];if(!f)return;try{const j=JSON.parse(await f.text());let list=j.items;if(!Array.isArray(list)&&j.acca)list=fromV1(j);if(!Array.isArray(list))throw new Error('no records found in the file');
merge(list);commit();toast('Imported '+list.length+' records')}catch(e){logE('import',e);alert('Could not import that file: '+e.message+'. Pick a NextRole (or older Ladder) backup .json file.')}inp.value=''}

// ---------- swipe between tabs: the page follows your finger, the next tab slides in beside it, then snaps ----------
(()=>{const T=TABS,m=document.querySelector('main'),v=$('#v');let S=null;
const reset=()=>{if(!S)return;[v,S.pp,S.pn].forEach(e=>{if(e){e.style.transition='';e.style.transform=''}});if(S.pp)S.pp.remove();if(S.pn)S.pn.remove();m.classList.remove('swp');S=null};
const panel=t=>{if(!t)return null;const d=document.createElement('div');d.className='w swpan';d.setAttribute('aria-hidden','true');d.inert=true;d.innerHTML=viewOf(t);d.style.top=Math.max(0,scrollY-m.offsetTop)+'px';m.appendChild(d);return d};
const place=dx=>{const W=S.w+24;v.style.transform=`translate3d(${dx}px,0,0)`;if(S.pp)S.pp.style.transform=`translate3d(${dx-W}px,0,0)`;if(S.pn)S.pn.style.transform=`translate3d(${dx+W}px,0,0)`};
document.addEventListener('touchstart',e=>{if(S&&S.anim)return;reset();const t=e.touches[0];if(e.touches.length>1||document.querySelector('dialog[open]')||e.target.closest('header,nav,dialog,#fab,#fm,#toast,input,select,textarea,.seg,.dots,.paper,summary'+(innerWidth<760?',.fr':''))||(window.visualViewport&&visualViewport.scale>1.01))return;
S={x:t.clientX,y:t.clientY,lock:0,dx:0,h:[[t.clientX,performance.now()]]}},{passive:true});
document.addEventListener('touchmove',e=>{if(!S||S.anim)return;if(e.touches.length>1){if(S.lock){S.anim=1;place(0);setTimeout(reset,0)}else S=null;return}const t=e.touches[0],dx=t.clientX-S.x,dy=t.clientY-S.y;
if(!S.lock){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;if(Math.abs(dy)*1.1>=Math.abs(dx)){S=null;return}S.lock=1;S.i=T.indexOf(tab);S.w=v.offsetWidth;S.pp=panel(T[S.i-1]);S.pn=panel(T[S.i+1]);m.classList.add('swp');fab(0);S.x=t.clientX-dx}
S.h.push([t.clientX,performance.now()]);if(S.h.length>5)S.h.shift();let d=dx;if((d>0&&!S.pp)||(d<0&&!S.pn))d/=3.5;S.dx=d;place(d)},{passive:true});
const end=()=>{if(!S)return;if(!S.lock||S.anim){if(!S.anim)S=null;return}const h=S.h,a=h[0],b=h[h.length-1],vel=(b[0]-a[0])/Math.max(1,b[1]-a[1]),d=S.dx,W=S.w+24,
dir=d<0&&S.pn&&(d<-S.w*.28||vel<-.35)?1:d>0&&S.pp&&(d>S.w*.28||vel>.35)?-1:0,ms=dir?Math.round(Math.min(320,Math.max(160,(W-Math.abs(d))/Math.max(1.2,Math.abs(vel))))):220;S.anim=1;
[v,S.pp,S.pn].forEach(e=>{if(e)e.style.transition=`transform ${ms}ms cubic-bezier(.2,.8,.2,1)`});place(dir?-dir*W:0);
setTimeout(()=>{const nt=dir?T[S.i+dir]:null;reset();if(nt){go(nt,0,1);buzz(6)}},ms+20)};
document.addEventListener('touchend',end,{passive:true});document.addEventListener('touchcancel',end,{passive:true})})();

// ---------- start ----------
// #add-win / #add-learning shortcuts from the home-screen icon
const quickAdd=h=>{if(h!=='add-win'&&h!=='add-learning')return 0;SEG.journal=h==='add-win'?'win':'cpd';go('journal',1);openE(SEG.journal);return 1};
addEventListener('popstate',()=>{const d=document.querySelector('dialog[open]');if(d){d.close();return}const h=location.hash.slice(1);
if(!quickAdd(h)&&isTab(h)&&h!==tab)go(h,1)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')return fab(0);
if(e.metaKey||e.ctrlKey||e.altKey||dlgOpen()||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||''))return;
const k=e.key.toLowerCase();
if(/^[1-5]$/.test(k))go(TABS[+k-1]);else if(k==='g')openE('goal');else if(k==='w')openE('win');else if(k==='l')openE('cpd');else if(k==='n')fab();else if(k===',')openSettings();else return;e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;FLD=1;if(!dlgOpen())render();flowPull();if(D.cfg.url&&Date.now()-(D.cfg.lastAt||0)>60000)sync()});
addEventListener('online',()=>{if(D.cfg.url)sync()});
addEventListener('storage',e=>{if(e.key!=='flow2.db')return;FLD=1;if(!dlgOpen())render()});
load().then(()=>{const h=location.hash.slice(1);if(isTab(h))tab=h;render();syIdle();quickAdd(h);
if(D.cfg.url)sync();flowPull()});
if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const w=r.installing;if(w)w.onstatechange=()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('A new version of NextRole is ready',()=>location.reload(),'Reload')}}}).catch(e=>logE('app','Offline support could not start: '+e.message))}
</script>
