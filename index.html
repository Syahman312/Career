let D={items:[],cfg:{url:'',token:''}},tab='home',VER=0,LOG=[],T,TT,UP=0,busy=0,editK='',editId=null,GF='All',SEG={journal:'win',profile:'cv'},LOGALL=0,TIPO=0;
const PAPERS=[['BT','Business & Technology','Applied Knowledge'],['MA','Management Accounting','Applied Knowledge'],['FA','Financial Accounting','Applied Knowledge'],
['LW','Corporate & Business Law','Applied Skills'],['PM','Performance Management','Applied Skills'],['TX','Taxation','Applied Skills'],['FR','Financial Reporting','Applied Skills'],['AA','Audit & Assurance','Applied Skills'],['FM','Financial Management','Applied Skills'],
['SBL','Strategic Business Leader','Strategic Professional'],['SBR','Strategic Business Reporting','Strategic Professional'],

['E1','Taxation','Expertise','TX'],['E2','Financial Reporting','Expertise','FR'],['E3','Audit, Risk & Control','Expertise','AA'],['E4','Finance & Investment','Expertise','FM'],['E5','Performance with Data Analysis','Expertise','PM'],

// ---------- storage (IndexedDB) ----------
const P=new Promise((r,j)=>{const q=indexedDB.open('ladder',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const kv=(m,k,v)=>P.then(d=>new Promise((r,j)=>{const s=d.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k'),q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}));
const save=()=>{VER++;return kv('put','d',D).catch(e=>{logE('storage',e);toast('Could not save on this device. Storage may be full.')})};
const logE=(a,m)=>{const x={t:Date.now(),a:String(a),m:String((m&&m.message)||m||'').replace(/token[^,;]*/gi,'token …').slice(0,300)};LOG.unshift(x);if(LOG.length>100)LOG.length=100;kv('put','log',LOG).catch(()=>{})};
addEventListener('error',e=>logE('app',(e.message||'Error')+(e.lineno?' (line '+e.lineno+')':'')));addEventListener('unhandledrejection',e=>logE('app',e.reason));

// ---------- helpers ----------
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),
live=k=>D.items.filter(i=>i.kind===k&&!i.deleted),
// id lookup map, rebuilt only when the item list is swapped or grows
IX={m:null,r:null,n:0},
get=id=>{if(IX.r!==D.items||IX.n!==D.items.length){IX.m=new Map(D.items.map(i=>[i.id,i]));IX.r=D.items;IX.n=D.items.length}return IX.m.get(id)},
me=()=>get('me')||{},
today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'',
sd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'',
mon=s=>s?new Date(s+'-01T00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}):'',
dd=s=>Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5),
inD=n=>n<0?Math.abs(n)+' day'+(n===-1?'':'s')+' ago':n===0?'today':n===1?'tomorrow':'in '+n+' days',
sum=(a,k)=>a.reduce((s,i)=>s+(+i[k]||0),0),
num=n=>(+n||0).toLocaleString('en-MY',{maximumFractionDigits:1}),
ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' days ago'},
safe=f=>{try{return f()}catch(e){logE('render',e);return '<p class="m">Something went wrong showing this part.</p>'}},
byDue=(a,b)=>(a.due||'9').localeCompare(b.due||'9'),
pOrd=c=>PAPERS.findIndex(p=>p[0]===c);
const okSt=a=>!!a&&['Passed','Exempt'].includes(a.st),pc=c=>get('acca-'+c),qv=()=>D.cfg.qv||(today()>=TRANS?'new':'old');
function accaPct(v){v=v||qv();if(v==='new'){const core=NQ.filter(q=>!q[2].startsWith('Options')),opt=NQ.filter(q=>q[2].startsWith('Options'));
const done=core.filter(q=>okSt(pc(q[3]))).length+Math.min(1,opt.filter(q=>okSt(pc(q[3]))).length);return{done,total:11,pct:done/11*100}}
const A=live('acca').filter(a=>OLDC.has(a.c)),req=A.filter(a=>!a.l.startsWith('Options')),opt=A.filter(a=>a.l.startsWith('Options')&&okSt(a)).length;
const done=req.filter(okSt).length+Math.min(2,opt);return{done,total:13,pct:done/13*100}}
// ---------- Flow link: read Flow's study data from this device (same site, read-only) ----------
const FST={Planned:'Not started',Studying:'Studying','Exam booked':'Booked',Passed:'Passed',Exempt:'Exempt'};let FLOW=null,FC=null,fBusy=0,FLD=1;
const toObj=a=>{const o={};(Array.isArray(a)?a:[]).forEach(r=>{if(r&&r.id)o[r.id]=r});return o};
// Flow data is parsed only when marked dirty (FLD=1), not on every render
function readFlow(){if(!FLD)return;FLD=0;FLOW=null;if(D.cfg.flowOff)return;let db=null,src='device';try{db=JSON.parse(localStorage.getItem('flow2.db')||'null')}catch(e){}
if(!db||typeof db.papers!=='object'||!Object.keys(db.papers).length){if(FC){db={papers:toObj(FC.papers),sessions:toObj(FC.sessions)};src='google'}else return}
const P={},byId={},yr={};let all=0;
Object.values(db.papers||{}).forEach(x=>{if(!x||x.deleted)return;const c=String(x.code||'').toUpperCase().trim();if(!(x.kind==='ACCA'||(!x.kind&&OLDC.has(c))))return;if(!(OLDC.has(c)||c==='SDS'||c==='EPSM'))return;
P[c]={st:FST[x.status]||'',exam:/^\d{4}-\d{2}-\d{2}$/.test(x.exam||'')?x.exam:'',score:x.score!=null&&x.score!==''&&isFinite(+x.score)?+x.score:'',tgt:+x.target||0,up:+x.updated||0,mins:0};byId[x.id]=c});
Object.values(db.sessions||{}).forEach(x=>{if(!x||x.deleted||!(+x.mins>0))return;const m=+x.mins,c=byId[x.paper],y=String(x.date||'').slice(0,4);if(c)P[c].mins+=m;if(x.paper&&db.papers[x.paper]){all+=m;yr[y]=(yr[y]||0)+m}});
FLOW={P,yr,all,n:Object.keys(P).length,src}}
// Read Flow's papers and study sessions from Flow's own Google web app (works on every device, read-only).
const fSlim=(r,k)=>{const o={};k.forEach(x=>{if(r[x]!==undefined)o[x]=r[x]});return o};
async function flowPull(manual){const c=D.cfg;if(fBusy||c.flowOff||!okUrl(c.flowUrl)||!c.flowKey)return;if(!manual&&Date.now()-(c.flowAt||0)<15*6e4)return;fBusy=1;
const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),60000);
try{const r=await fetch(c.flowUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'pull',key:c.flowKey,device:'NextRole',since:0,full:true}),signal:ac.signal,credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});
const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){throw new Error(/<html/i.test(tx)?'Google sent a web page instead of data. Check the Flow link':'unreadable reply from Flow')}
if(!j.ok)throw new Error(j.error||'Flow did not accept the request');const d=j.data||{};
FC={at:Date.now(),papers:(d.papers||[]).map(x=>fSlim(x,['id','kind','code','status','exam','score','target','updated','deleted'])),sessions:(d.sessions||[]).map(x=>fSlim(x,['id','paper','date','mins','deleted']))};
await kv('put','flowc',FC);FLD=1;c.flowAt=FC.at;c.flowErr='';save();if(!dlgOpen())render();if(manual)toast('Read '+FC.papers.length+' subjects from Flow')}
catch(e){c.flowErr=e.name==='AbortError'?'no reply from Flow after 60 seconds':e.message;logE('flow',c.flowErr);save();if(manual)toast('Could not read Flow: '+c.flowErr)}
finally{clearTimeout(tm);fBusy=0}}
async function saveFlowLink(){const u=$('#f_url').value.trim(),k=$('#f_key').value.trim();if(u&&!okUrl(u))return alert('That does not look like a Flow web app link. Copy it from Flow › Settings › Web App URL. It ends with /exec.');
D.cfg.flowUrl=u;D.cfg.flowKey=k;D.cfg.flowErr='';D.cfg.flowAt=0;if(!u){FC=null;FLD=1;kv('put','flowc',null)}await save();if(u&&k)await flowPull(1);render();openSettings()}
const fH=c=>{const x=FLOW&&FLOW.P[c];return x&&(x.mins||x.tgt)?'📚 '+num(x.mins/60)+(x.tgt?' / '+x.tgt:'')+' h in Flow':''};
const flowYrH=y=>FLOW&&D.cfg.flowHrs!==0?(FLOW.yr[y]||0)/60:0;
function flowDiffs(){if(!FLOW)return[];const ign=+D.cfg.flowIgn||0,o=[];Object.entries(FLOW.P).forEach(([c,x])=>{const it=pc(c);if(!it||x.up<=Math.max(+it.updated||0,ign))return;const ch={};
if(x.st&&x.st!==it.st&&!(x.st==='Not started'&&okSt(it)))ch.st=x.st;if(x.exam&&x.exam!==it.date)ch.date=x.exam;if(x.score!==''&&+x.score!==+it.score)ch.score=x.score;if(Object.keys(ch).length)o.push([c,ch])});return o}
function flowApply(){const now=Date.now(),L=flowDiffs();L.forEach(([c,ch])=>{const it=pc(c);Object.assign(it,ch);it.updated=now;autoSit(it)});commit();toast('Updated '+L.length+' paper'+(L.length>1?'s':'')+' from Flow')}
function flowIgnore(){D.cfg.flowIgn=Date.now();save();render()}
const modSrc=c=>c==='RBM'?(okSt(pc('BT'))?'BT':''):c==='ESL'?(okSt(pc('EPSM'))?'EPSM':''):c==='DTI'?(['LW','PM','TX','FR','AA','FM'].every(x=>okSt(pc(x)))?'all Applied Skills':''):'';
// ---------- next role: choose yourself or automatic ----------
const LAD=['Intern','Executive','Senior Executive','Assistant Manager','Manager','Senior Manager','Financial Controller','Head of Finance','Chief Financial Officer'];
const LADRX=[[/chief financial|\bcfo\b/i,8],[/head of|director|\bvp\b/i,7],[/controller/i,6],[/senior manager|\bsm\b/i,5],[/assistant manager|asst\.? manager|\bam\b/i,3],[/manager/i,4],[/senior (executive|associate|analyst|accountant|officer)|\bse\b/i,2],[/executive|associate|analyst|accountant|officer|specialist/i,1],[/intern|trainee|graduate|clerk|accounts? assistant/i,0]];
function roleLvl(r){r=String(r||'');for(const[x,i]of LADRX)if(x.test(r))return i;return -1}
const roleFn=r=>{const m=String(r||'').match(/\s*(?:,|\s[-–—]\s|\bof\b)\s*(.+)$/i);return m&&!/^finance$/i.test(m[1])?m[1].trim():''};
const withFn=(i,fn)=>LAD[i]+(fn&&i<6?', '+fn:'');
function autoNext(r){const i=roleLvl(r);return i<0?'':i>=LAD.length-1?String(r):withFn(i+1,roleFn(r))}
function rolePath(r){const i=roleLvl(r),fn=roleFn(r);return i<0?[]:LAD.slice(i).slice(0,4).map((x,k)=>withFn(i+k,fn))}

function ring(p,big,small,sz=116,col='var(--cy)'){const r=50,c=2*Math.PI*r;return `<div style="position:relative;width:${sz}px;height:${sz}px;flex:none"><svg viewBox="0 0 120 120" width="${sz}" height="${sz}" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#24252a" stroke-width="10"/><circle class="ring" style="--c:${c}" cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(100,p)/100)}" transform="rotate(-90 60 60)"/></svg><div class="rn"><b>${big}</b><span>${small}</span></div></div>`}
const kpis=a=>'<div class="kpis">'+a.map(([l,v,c])=>`<div class="kpi"><span>${l}</span><b${c?` class="${c}"`:''}>${v}</b></div>`).join('')+'</div>';
const sh=(l,r)=>`<div class="sh"><span>${l}</span><span>${r??''}</span></div>`;
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function confetti(){const d=document.createElement('div');d.className='cf';d.innerHTML=Array.from({length:60},()=>`<i style="left:${Math.random()*100}%;background:${['#22e3ff','#fbbf24','#4ade80','#a78bfa','#f87171'][Math.floor(Math.random()*5)]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s"></i>`).join('');document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}

// ---------- data cleaning (also used for synced data) ----------
const KINDS=['me','goal','acca','skill','win','cpd','job','edu','sit'],NUMF=['pct','score','lvl','tgt','hrs','updated','deleted','ver','cvw','cvl'],DATEF=['due','date'],MONF=['start','end'],
STRF={kind:8,title:200,area:20,next:300,notes:1000,c:4,n:80,l:40,st:20,name:120,impact:300,type:20,co:120,loc:80,pts:3000,inst:120,qual:160,grade:40,email:120,phone:40,link:200,role:120,target:120,tmode:8,exb:200,res:10,fid:80,fn:120,mime:60,summary:1000};
function clean(i){if(!i||typeof i!=='object'||Array.isArray(i))return null;if(typeof i.id!=='string'||!/^[\w.:-]{1,80}$/.test(i.id))return null;if(!KINDS.includes(i.kind))return null;const o={};
for(const k of Object.keys(i)){const v=i[k];
if(NUMF.includes(k)){if(v==='')o[k]='';else if(v!=null){const n=+v;if(isFinite(n))o[k]=n}}
else if(DATEF.includes(k))o[k]=typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';
else if(MONF.includes(k))o[k]=typeof v==='string'&&/^\d{4}-\d{2}$/.test(v)?v:'';
else if(k==='id')o.id=v;
else if(k in STRF){if(v!=null)o[k]=String(v).slice(0,STRF[k])}}
o.updated=+o.updated||0;return o}

[['Group consolidation (IFRS 10)',3,5],['Intercompany eliminations',3,5],['Excel / Power Query',3,4],['Power BI',1,4],['Stakeholder communication',3,4],['MFRS / IFRS reporting',3,5]].forEach(([name,lvl,tgt],k)=>D.items.push({id:'sk-'+k,kind:'skill',name,lvl,tgt,updated:1}));

{id:'g-start2',kind:'goal',title:'Pass SBR',area:'ACCA',due:'2027-03-31',pct:10,next:'Finish IFRS 10/3 chapters',updated:1},
{id:'job-start',kind:'job',co:'KPJ Healthcare',title:'Executive, Group Consolidation',loc:'Malaysia',start:'',end:'',pts:'Prepare monthly group consolidation and intercompany eliminations\nSupport group financial reporting under MFRS',updated:1})}

const m=S.me||{};o.push({id:'me',kind:'me',name:m.name||'',email:m.email||'',phone:m.phone||'',loc:m.loc||'',link:m.link||'',summary:m.summary||'',role:S.role||'',target:S.target||'',cvw:S.cv&&S.cv.wins===false?0:1,cvl:S.cv&&S.cv.learn?1:0,updated:n});

(S.acca||[]).forEach(a=>{const P0=PAPERS.find(p=>p[0]===a.c);if(P0)o.push({id:'acca-'+a.c,kind:'acca',c:a.c,n:P0[1],l:P0[2],st:a.st||'Not started',date:a.date||'',score:a.score===''?'':+a.score,updated:n})});
(S.skills||[]).forEach(s=>o.push({id:id('sk',s.id),kind:'skill',name:s.n,lvl:+s.l||1,tgt:+s.t||4,updated:n}));
(S.wins||[]).forEach(w=>o.push({id:id('w',w.id),kind:'win',date:w.date,title:w.t,impact:w.i,updated:n}));
(S.cpd||[]).forEach(c=>o.push({id:id('c',c.id),kind:'cpd',date:c.date,title:c.t,type:c.k,hrs:+c.hrs||0,updated:n}));
(S.jobs||[]).forEach(j=>o.push({id:id('job',j.id),kind:'job',co:j.co,title:j.title,loc:j.loc,start:j.start,end:j.end,pts:j.pts,updated:n}));
(S.edu||[]).forEach(e=>o.push({id:id('edu',e.id),kind:'edu',inst:e.i,qual:e.q,grade:e.g,start:e.start,end:e.end,updated:n}));

async function load(){try{const v=await kv('get','d');if(v){D.items=(v.items||[]).map(clean).filter(Boolean);D.cfg={...D.cfg,...v.cfg}}LOG=(await kv('get','log'))||[];FC=(await kv('get','flowc'))||null;FLD=1}catch(e){logE('storage',e)}
if(!D.items.length){let old=null;try{old=JSON.parse(localStorage.getItem('ladder_v1'))}catch(e){}

// ---------- render ----------
function render(){readFlow();const m=me(),a=accaPct();
$('#nm').textContent=m.name||'NextRole';$('#av').textContent=(m.name||'N').trim().charAt(0).toUpperCase()||'N';
$('#sub').textContent=m.target?'Next: '+m.target:m.role||'Set your role in Profile';
$('#odo').innerHTML=a.done+'/'+a.total+'<small>ACCA</small>';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
$('#fab').hidden=tab==='profile'&&SEG.profile==='cv';
$('#v').innerHTML=viewOf(tab)}
const pushTab=()=>{try{history.pushState(null,'','#'+tab)}catch(e){}};
function go(t,np,sw){if(!isTab(t))t='home';if(!np&&location.hash!=='#'+t)try{history.pushState(null,'','#'+t)}catch(e){}tab=t;fab(0);render();const v=$('#v');v.classList.remove('an');if(!sw){void v.offsetWidth;v.classList.add('an');setTimeout(()=>v.classList.remove('an'),350)}scrollTo(0,0)}
const viewOf=t=>safe({home,goals:goalsTab,acca:accaTab,journal,profile}[t]||home);
function setSeg(k,v){SEG[k]=v;render()}
function fab(o){const f=$('#fab'),m=$('#fm'),on=o===undefined?m.hidden:!!o;m.hidden=!on;f.classList.toggle('open',on)}

function home(){const m=me(),a=accaPct(),G=live('goal'),og=G.filter(g=>+g.pct<100),gp=G.length?sum(G,'pct')/G.length:0,y=String(new Date().getFullYear()),
C=live('cpd').filter(c=>(c.date||'').startsWith(y)),hrs=sum(C,'hrs'),W=live('win'),wy=W.filter(w=>(w.date||'').startsWith(y)).length,ne=nextExam(),
S=live('skill'),atT=S.filter(s=>+s.lvl>=+s.tgt).length,gap=S.filter(s=>+s.tgt>+s.lvl).sort((x,z)=>(z.tgt-z.lvl)-(x.tgt-x.lvl)).slice(0,3),
passed=live('acca').filter(p=>okSt(p)&&(OLDC.has(p.c)||p.c==='SDS')).sort((x,z)=>pOrd(x.c)-pOrd(z.c)),h=new Date().getHours(),
up=[...og.filter(g=>g.due&&dd(g.due)<=60).map(g=>({d:g.due,t:g.title,s:g.area,id:g.id,k:'goal'})),...live('acca').filter(p=>p.st==='Booked'&&p.date&&dd(p.date)>=0).map(p=>({d:p.date,t:p.c+' exam',s:p.n,id:p.id,k:'acca'}))].sort((x,z)=>x.d.localeCompare(z.d)).slice(0,5),
lastWin=W.map(w=>w.date).sort().pop(),nudge=!lastWin||dd(lastWin)<-14;
return `<p class="hi">${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}${m.name?', <b>'+E(m.name.split(' ')[0])+'</b>':''}.</p>
<div class="c glow mt"><div class="hero">${ring(a.pct,Math.round(a.pct)+'%','ACCA')}<div style="min-width:0"><div class="m">Now</div><b>${E(m.role||'—')}</b><div class="m mt">Next role${m.tmode==='auto'?' <span class="tag s3" style="font-size:10.5px">Auto</span>':''}</div><b class="cl" onclick="openE('me','me')" title="Change next role">${E(m.target||'Tap to set')}</b></div></div>
${passed.length?`<div class="chips">${passed.map(p=>`<span class="chip2 s0">✓ ${E(p.c)}</span>`).join('')}</div>`:''}</div>
${kpis([['Goals',Math.round(gp)+'%'],['Next exam',ne?E(ne.c)+' · '+dd(ne.date)+'d':'—',ne&&dd(ne.date)<=30?'s1':''],['Learning '+y,num(hrs+flowYrH(y))+' h'],['Wins '+y,wy],['Open goals',og.length],['Skills at target',atT+'/'+S.length,S.length&&atT===S.length?'s0':'']])}
${nudge?`<div class="c cl" style="border-color:var(--amb)" onclick="openE('win')"><b>🏆 ${lastWin?'No wins logged for '+Math.abs(dd(lastWin))+' days':'Log your first win'}</b><div class="m">Small things count. Note the impact while it is fresh. It feeds your appraisal and resume.</div></div>`:''}
${up.length?'<section>'+sh('Coming up')+'<div class="c">'+up.map(u=>{const n=dd(u.d);return `<div class="pc" onclick="openE('${u.k}','${E(u.id)}')"><div style="flex:1;min-width:0"><b>${E(u.t)}</b><div class="m">${E(u.s||'')} · ${fd(u.d)}</div></div><span class="tag ${n<0?'s2':n<=14?'s1':'s3'}">${inD(n)}</span></div>`}).join('')+'</div></section>':''}
<section>${sh('Next actions')}${og.filter(g=>g.next).length?'<div class="c">'+og.filter(g=>g.next).sort(byDue).map(g=>`<div class="pc" onclick="openE('goal','${E(g.id)}')"><span class="tag s3">${E(g.area||'Goal')}</span><div style="flex:1;min-width:0">${E(g.next)}<div class="m">${E(g.title)}</div></div></div>`).join('')+'</div>':'<p class="m">No open actions. Add a next step to a goal.</p>'}</section>
<section>${sh('Biggest skill gaps')}${gap.length?'<div class="c">'+gap.map(s=>`<div class="pc" onclick="SEG.profile='skills';go('profile')"><div style="flex:1;min-width:0">${E(s.name)}<div class="bar"><i style="width:${s.lvl/5*100}%"></i></div></div><span class="tag s1">${s.lvl} → ${s.tgt}</span></div>`).join('')+'</div>':'<p class="m">No gaps. 🎉</p>'}</section>`}

function goalCard(g){const n=g.due?dd(g.due):null,d=+g.pct>=100;return `<div class="c cl" onclick="openE('goal','${E(g.id)}')"><div class="r"><b>${E(g.title)}</b><b class="${d?'s0':''}">${g.pct||0}%</b></div><div class="bar"><i style="width:${Math.min(100,g.pct||0)}%;${d?'background:var(--grn)':''}"></i></div>
<div class="r"><span class="m">${E(g.area||'')}${g.next&&!d?' · Next: '+E(g.next):''}</span>${g.due&&!d?`<span class="tag ${n<0?'s2':n<=30?'s1':'s4'}">${n<0?'Overdue':sd(g.due)}</span>`:''}</div>
${d?'':`<div class="btns mt"><button class="btn sm" onclick="event.stopPropagation();bump('${E(g.id)}',10)">+10%</button><button class="btn sm" onclick="event.stopPropagation();bump('${E(g.id)}',100)">✓ Done</button></div>`}</div>`}
function bump(id,v){const g=get(id);if(!g)return;const was=+g.pct||0;g.pct=v>=100?100:Math.min(100,was+v);g.updated=Date.now();commit();if(g.pct>=100&&was<100){confetti();buzz([10,40,10]);toast('Goal done! 🎉',()=>{g.pct=was;g.updated=Date.now();commit()})}}
function goalsTab(){const G=live('goal'),F=G.filter(g=>GF==='All'||g.area===GF),o=F.filter(g=>+g.pct<100).sort(byDue),d=F.filter(g=>+g.pct>=100);
return kpis([['Open',G.filter(g=>+g.pct<100).length],['Done',G.filter(g=>+g.pct>=100).length,'s0'],['Overdue',G.filter(g=>+g.pct<100&&g.due&&dd(g.due)<0).length,'s2']])+
`<div class="fr">${['All',...AREAS].map(a=>`<span class="chip2${a===GF?' on':''}" onclick="GF='${a}';render()">${a}</span>`).join('')}</div>`+
sh('In progress',o.length)+(o.length?'<div class="g2">'+o.map(goalCard).join('')+'</div>':'<p class="m">No open goals here. Tap + to add one.</p>')+(d.length?sh('Done',d.length)+'<div class="g2">'+d.map(goalCard).join('')+'</div>':'')}

function setQv(x){D.cfg.qv=x===(today()>=TRANS?'new':'old')?'':x;save();render()}
function prow(p,code,name,sub,tag,tc){const n=p&&p.date?dd(p.date):null;return `<div class="pc" onclick="openE('acca','${E(p.id)}')"><span class="code ${tc}">${E(code)}</span><div style="flex:1;min-width:0"><div>${E(name)}</div><div class="m">${[sub,p.st==='Booked'&&p.date?fd(p.date)+' · '+inD(n):p.date?fd(p.date):'',p.score!==''&&p.score!=null&&+p.score>0?p.score+' marks':''].filter(Boolean).join(' · ')}</div></div><span class="tag ${tc}">${E(tag)}</span></div>`}
function transTips(){const t=[],ok=c=>okSt(pc(c)),AS=['LW','PM','TX','FR','AA','FM'],left=AS.filter(c=>!ok(c)),opts=['AFM','APM','ATX','AAA'].filter(ok).length;
if(!ok('BT'))t.push('BT is retired. Without it you take the <b>Responsible Business Management</b> module instead.');
if(!ok('LW'))t.push('Pass <b>LW</b> by June 2027, or sit <b>K3 Business Law</b> before or alongside your first Expertise exam.');
if(left.length)t.push('Applied Skills not finished ('+left.join(', ')+'). Unless all are done by June 2027 you also need the <b>Digital Tech &amp; Innovation</b> module (about 100 hours).');
if(opts<2)t.push('Only <b>1 option</b> is needed after the change'+(opts?'. Your passed option already covers it.':'. Two are needed if you finish before.'));
if(!ok('EPSM'))t.push('Finishing <b>EPSM</b> before the change gives credit for the Ethical, Sustainable Leadership module.');
return t}
function accaTab(){const v=qv(),a=accaPct(v),A=live('acca'),sat=A.filter(p=>['Passed','Failed'].includes(p.st)),pass=sat.filter(p=>p.st==='Passed'),ex=A.filter(p=>p.st==='Exempt'&&p.c!=='EPSM'),sc=pass.filter(p=>p.score!==''&&p.score!=null&&+p.score>0),ne=nextExam(),
cols=['#22e3ff','#4ade80','#fbbf24','#a78bfa'],left=a.total-a.done,
lv=v==='new'?[...new Set(NQ.map(q=>q[2]))]:[...new Set(PAPERS.map(p=>p[2]))],
GC={},grp=l=>GC[l]||(GC[l]=v==='new'?NQ.filter(q=>q[2]===l).map(q=>({p:pc(q[3]),code:q[0],name:q[1],sub:[q[3]==='SDS'?'New option':'Was '+q[3],atT(q[3]),okSt(pc(q[3]))?'':fH(q[3])].filter(Boolean).join(' · ')})):PAPERS.filter(x=>x[2]===l).map(x=>({p:pc(x[0]),code:x[0],name:x[1],sub:[atT(x[0]),okSt(pc(x[0]))?'':fH(x[0])].filter(Boolean).join(' · ')}))),
need=l=>l.startsWith('Options')?(v==='new'?1:2):grp(l).length,dn=l=>Math.min(need(l),grp(l).filter(r=>okSt(r.p)).length),
dl=dd(TRANS),tips=dl>0?transTips():[];
let h=`<div class="seg"><button class="${v==='old'?'on':''}" onclick="setQv('old')">Current · 13 papers</button><button class="${v==='new'?'on':''}" onclick="setQv('new')">From Sep 2027 · 11</button></div>
<div class="c glow"><div class="hero">${ring(a.pct,a.done+'/'+a.total,'papers')}<div style="min-width:0"><b style="font-size:18px">${left?left+' paper'+(left===1?'':'s')+' to go':'ACCA exams complete! 🎓'}</b>
<div class="m mt">${ne?'Next: <b style="color:var(--tx)">'+E(ne.c)+'</b> on '+fd(ne.date)+' ('+inD(dd(ne.date))+')':'No exam booked. Tap a paper to set the date.'}</div></div></div>
<div class="sbar">${lv.map((l,k)=>`<i style="width:${dn(l)/a.total*100}%;background:${cols[k]}"></i>`).join('')}</div>
<div class="m">${lv.map((l,k)=>`<span style="color:${cols[k]}">■</span> ${l.replace(/ – pick \d/,'')}`).join(' &nbsp; ')}</div>
<div class="btns mt"><button class="btn sm" onclick="openEx()">🎓 Set exemptions</button></div></div>
${kpis([['Passed',pass.length,'s0'],['Exempt',ex.length,'s5'],['Avg score',sc.length?Math.round(sum(sc,'score')/sc.length):'—']])}`;
const fd0=flowDiffs();if(fd0.length)h+=`<div class="c" style="border-color:var(--cy)"><b>Flow has newer info for ${fd0.length} paper${fd0.length>1?'s':''}</b><ul class="m" style="margin:6px 0 0;padding-left:18px">${fd0.map(([c,ch])=>`<li><b style="color:var(--tx)">${c}</b>: ${[ch.st,ch.date?'exam '+fd(ch.date):'',ch.score!==undefined?ch.score+' marks':''].filter(Boolean).join(' · ')}</li>`).join('')}</ul><div class="btns mt"><button class="btn sm pri" onclick="flowApply()">Update from Flow</button><button class="btn sm" onclick="flowIgnore()">Ignore</button></div></div>`;
if(tips.length)h+=`<details class="c" style="border-color:var(--amb)" ontoggle="TIPO=this.open"${TIPO?' open':''}><summary class="r"><b>Syllabus change: Sep 2027 · ${tips.length} tip${tips.length>1?'s':''} for you</b><span><span class="tag s1">${Math.ceil(dl/7)} weeks</span> <span class="chev">▾</span></span></summary><div class="m mt">June 2027 is the last sitting of the current Applied Skills and Strategic exams. Everything you pass or are exempt from carries over as credit. For you:</div><ul class="m" style="margin:8px 0 0;padding-left:18px">${tips.map(t=>`<li style="margin:4px 0">${t}</li>`).join('')}</ul></details>`;
h+=lv.map(l=>'<section>'+sh(l,dn(l)+'/'+need(l))+'<div class="c">'+grp(l).map(r=>{const p=r.p;if(!p)return '';const ok=okSt(p),tg=v==='new'&&ok?'Credit':p.st,tc=v==='new'&&ok?'s0':stc(p.st);return prow(p,r.code,r.name,r.sub,tg,tc)}).join('')+'</div></section>').join('');
if(v==='new'){const M=[['DTI','Digital Tech & Innovation'],['RBM','Responsible Business Management'],['ESL','Ethical, Sustainable Leadership']];
h+='<section>'+sh('Modules')+'<div class="c">'+M.map(([c,n])=>{const p=pc(c);if(!p)return '';const src=modSrc(c),ok=src||okSt(p);return prow(p,c,n,src?'Credit from '+src:c==='DTI'?'Not needed if all Applied Skills are done by June 2027':'',ok?'Credit':p.st,ok?'s0':stc(p.st))}).join('')+'</div></section>';
h+=`<p class="m mt">From September 2027 you need 11 exams: K1–K3, E1–E5, S1, S2 and 1 option, plus the modules. Credit is worked out from your current passes and exemptions. Check your own position with ACCA's transition tool.</p>`}
else{const p=pc('EPSM');h+='<section>'+sh('Module')+'<div class="c">'+(p?prow(p,'EPSM','Ethics & Professional Skills','Needed for membership',p.st,stc(p.st)):'')+'</div></section>'+
`<p class="m mt">Pass mark is 50. You need 13 papers: 9 Applied, 2 Strategic and 2 of the 4 options, plus EPSM.</p>`}
return h}
function openEx(){const m=me(),d=$('#st');$('#stc').innerHTML=`<h2>Exemptions</h2><p class="m">ACCA can exempt you from Applied Knowledge and Applied Skills papers based on your degree or another qualification. Tick the ones on your exemption letter or in myACCA. Strategic Professional papers can't be exempted.</p>
<label class="f"><span>Exempted because of</span><input id="x_b" value="${E(m.exb||'')}" placeholder="e.g. Bachelor of Accounting (Hons)" autocomplete="off"></label>
${EXP.map(c=>{const p=pc(c);if(!p)return '';return `<label class="switch"><span><b class="code s5" style="display:inline-block;margin-right:8px">${c}</b>${E(p.n)}${p.st==='Passed'?' <span class="m">(passed)</span>':''}</span><input type="checkbox" id="x_${c}" ${p.st==='Exempt'?'checked':''} ${p.st==='Passed'?'disabled':''}></label>`}).join('')}
<p class="m">From September 2027 these carry over as credit, for example FA → K1 and FR → E2.</p>
<div class="row mt"><button type="button" class="g" onclick="$('#st').close()">Cancel</button><button type="button" onclick="saveEx()">Save</button></div>`;if(!d.open){d.showModal();pushTab()}d.scrollTop=0}
function saveEx(){let n=0;const now=Date.now();EXP.forEach(c=>{const p=pc(c),el=$('#x_'+c);if(!p||!el||el.disabled)return;const want=el.checked;
if(want&&p.st!=='Exempt'){p.st='Exempt';p.date='';p.score='';p.updated=now}else if(!want&&p.st==='Exempt'){p.st='Not started';p.updated=now}if(want)n++});
const m=get('me'),b=$('#x_b').value.trim();if(m&&(m.exb||'')!==b){m.exb=b;m.updated=now}$('#st').close();commit();toast(n?n+' exemption'+(n>1?'s':'')+' saved':'Exemptions cleared')}

function tline(a,row,head){const g={};a.forEach(i=>{const k=(i.date||'').slice(0,7)||'—';(g[k]=g[k]||[]).push(i)});
return '<div class="tl">'+Object.keys(g).sort().reverse().map(k=>`<div class="mh"><div class="r"><span class="m">${k==='—'?'NO DATE':new Date(k+'-01T00:00').toLocaleString('en-GB',{month:'long',year:'numeric'}).toUpperCase()}</span><b>${head(g[k])}</b></div></div>`+g[k].map(row).join('')).join('')+'</div>'}
const cico=t=>({Course:'🎓',Webinar:'💻',Book:'📖','On-the-job':'🛠️',Mentoring:'🤝',Conference:'🎤'}[t]||'📚');
function journal(){const s=SEG.journal,y=String(new Date().getFullYear()),srt=a=>a.sort((x,z)=>(z.date||'').localeCompare(x.date||''));
let h=`<div class="seg"><button class="${s==='win'?'on':''}" onclick="setSeg('journal','win')">🏆 Wins</button><button class="${s==='cpd'?'on':''}" onclick="setSeg('journal','cpd')">📚 Learning</button></div>`;
if(s==='win'){const W=srt(live('win')),mo=today().slice(0,7);
h+=kpis([['This month',W.filter(w=>(w.date||'').startsWith(mo)).length],['This year',W.filter(w=>(w.date||'').startsWith(y)).length],['All time',W.length]])+
'<p class="m">For appraisals and your resume. Say what changed: time saved, RM, accuracy, people helped.</p>'+
(W.length?tline(W,w=>`<div class="ti" onclick="openE('win','${E(w.id)}')"><span class="ic w">🏆</span><div class="r"><b>${E(w.title)}</b><span class="m">${sd(w.date)}</span></div>${w.impact?`<div class="m">${E(w.impact)}</div>`:''}</div>`,a=>a.length+' win'+(a.length>1?'s':'')):'<p class="m mt">No wins yet. Tap + to log one this week.</p>')}
else{const C=srt(live('cpd')),CY=C.filter(c=>(c.date||'').startsWith(y)),fy=flowYrH(y),hy=sum(CY,'hrs')+fy,vy=sum(CY.filter(c=>c.ver),'hrs'),tg=+D.cfg.cpdT||40;
h+=`<div class="c glow mt"><div class="r"><b>${y} learning</b><b>${num(hy)} / ${tg} h</b></div><div class="bar"><i style="width:${Math.min(100,hy/tg*100)}%;${hy>=tg?'background:var(--grn)':''}"></i></div><div class="m">${fy?num(fy)+' h study from Flow · ':''}${num(vy)} h verifiable · ${hy>=tg?'Target met 🎉':num(tg-hy)+' h to go'} · change target in Settings</div></div>`+
kpis([['Entries',CY.length],['This month',num(sum(C.filter(c=>(c.date||'').startsWith(today().slice(0,7))),'hrs'))+' h'],['All time',num(sum(C,'hrs'))+' h']])+
(C.length?tline(C,c=>`<div class="ti" onclick="openE('cpd','${E(c.id)}')"><span class="ic">${cico(c.type)}</span><div class="r"><b>${E(c.title)}</b><b>${num(c.hrs)} h</b></div><div class="r"><span class="m">${E(c.type||'')}${c.ver?' · <span class="s0">Verifiable</span>':''}</span><span class="m">${sd(c.date)}</span></div></div>`,a=>num(sum(a,'hrs'))+' h'):'<p class="m mt">Nothing logged yet. Tap + to add a course, book or webinar.</p>')}
return h}

function profile(){const s=SEG.profile,T=[['cv','📄 Resume'],['jobs','💼 Jobs'],['edu','🎓 Education'],['skills','⭐ Skills']];
let h=`<div class="seg np">${T.map(([k,l])=>`<button class="${s===k?'on':''}" onclick="setSeg('profile','${k}')">${l}</button>`).join('')}</div>`;
if(s==='cv'){const m=me();h+=`<div class="c np"><div class="btns"><button class="btn sm" onclick="openE('me','me')">✏️ Edit details</button><button class="btn sm pri" onclick="printCV()">🖨 Print / PDF</button><button class="btn sm" onclick="copyCV()">📋 Copy text</button></div>
<label class="switch"><span>Include wins</span><input type="checkbox" ${m.cvw?'checked':''} onchange="setMe('cvw',this.checked?1:0)"></label><label class="switch"><span>Include training</span><input type="checkbox" ${m.cvl?'checked':''} onchange="setMe('cvl',this.checked?1:0)"></label>
<p class="m" style="margin:0">Built from your Jobs, Education, ACCA, Skills (level 3+) and latest 5 wins.</p></div><div class="paper" id="cvp">${cvHTML()}</div>`}
else if(s==='jobs'){const J=live('job').sort((a,b)=>(b.start||'').localeCompare(a.start||''));h+=`<button onclick="openE('job')" style="width:100%">+ Add job</button>`+(J.length?'<div class="g2">'+J.map(j=>`<div class="c cl" onclick="openE('job','${E(j.id)}')"><div class="r"><b>${E(j.title||'Untitled role')}</b>${j.end?'':'<span class="tag s3">Current</span>'}</div><div class="m">${E(j.co)}${j.loc?' · '+E(j.loc):''} · ${mon(j.start)||'?'} – ${mon(j.end)||'Present'}</div>${j.pts?`<div class="m mt">${j.pts.split('\n').filter(Boolean).length} key points</div>`:''}</div>`).join('')+'</div>':'<p class="m mt">No jobs yet.</p>')}
else if(s==='edu'){const Q=live('edu').sort((a,b)=>(b.end||'9').localeCompare(a.end||'9'));h+=`<button onclick="openE('edu')" style="width:100%">+ Add education</button>`+(Q.length?'<div class="g2">'+Q.map(e=>`<div class="c cl" onclick="openE('edu','${E(e.id)}')"><b>${E(e.qual||e.inst)}</b><div class="m">${E(e.inst)} · ${mon(e.start)||'?'} – ${mon(e.end)||'Present'}${e.grade?' · '+E(e.grade):''}</div></div>`).join('')+'</div>':'<p class="m mt">No education yet.</p>')+'<p class="m">ACCA goes on your resume by itself from the ACCA tab.</p>'}
else{const S=live('skill').sort((a,b)=>(b.tgt-b.lvl)-(a.tgt-a.lvl));h+=`<button onclick="openE('skill')" style="width:100%">+ Add skill</button><p class="m">Tap a dot to set your level (1 beginner → 5 expert). Amber ring = target.</p><div class="g2">`+
S.map(k=>`<div class="c"><div class="r cl" onclick="openE('skill','${E(k.id)}')"><b>${E(k.name)}</b><span class="tag ${+k.lvl>=+k.tgt?'s0':'s1'}">${k.lvl} / ${k.tgt}</span></div><div class="dots">${[1,2,3,4,5].map(n=>`<button aria-label="Level ${n}" class="${n<=k.lvl?'on':''}${n===+k.tgt?' tg':''}" onclick="lvl('${E(k.id)}',${n})"></button>`).join('')}</div></div>`).join('')+'</div>'}

<label class="switch"><span>Add exams and goal due dates to Google Calendar</span><input type="checkbox" ${c.cal?'checked':''} onchange="D.cfg.cal=this.checked;save();sync(1)"></label>
<p class="m">They go to a “Career” calendar with alerts 7 days and 1 day before.</p>
<h3>Flow</h3><p class="m">${FLOW?(FLOW.src==='google'?'Linked through Google':'Linked on this device')+': '+FLOW.n+' ACCA paper'+(FLOW.n===1?'':'s')+', '+num(FLOW.all/60)+' h of study logged.':c.flowOff?'Flow link is off.':'Flow not linked yet.'} NextRole only reads Flow; it never changes it.</p>
<p class="m">Same browser as Flow: works by itself. iPhone/iPad home-screen apps and other devices: link through Google once on each device. Copy the two values from <b>Flow › Settings</b>.</p>
<label class="f"><span>Flow Web App URL</span><input id="f_url" value="${E(c.flowUrl||'')}" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url" autocomplete="off" spellcheck="false"></label>
<label class="f"><span>Flow App key</span><div class="pw"><input id="f_key" type="password" value="${E(c.flowKey||'')}" autocomplete="off" spellcheck="false" autocapitalize="off"><button type="button" class="eye" aria-label="Show" aria-pressed="false" onclick="pwT(this)">${EYEI}</button></div></label>
<div class="btns" style="margin-top:12px"><button class="btn sm pri" onclick="saveFlowLink()">${c.flowUrl?'Save &amp; refresh':'Link Flow'}</button>${c.flowUrl?'<button class="btn sm" onclick="flowPull(1).then(openSettings)">↻ Refresh now</button>':''}</div>
${c.flowUrl?`<p class="m">${c.flowErr?'<span class="s2">Last try failed: '+E(c.flowErr)+'</span>':c.flowAt?'Read from Flow '+ago(c.flowAt)+'. Refreshes every 15 minutes while open.':'Not read yet.'}</p>`:''}
<label class="switch"><span>Use Flow study data</span><input type="checkbox" ${c.flowOff?'':'checked'} onchange="D.cfg.flowOff=this.checked?0:1;FLD=1;save();render();openSettings()"></label>
<label class="switch"><span>Count Flow study in learning hours</span><input type="checkbox" ${c.flowHrs===0?'':'checked'} onchange="D.cfg.flowHrs=this.checked?1:0;save();render()"></label>
<h3>Learning</h3><label class="f"><span>Yearly learning target (hours)</span><input type="number" inputmode="numeric" min="1" value="${+c.cpdT||40}" onchange="D.cfg.cpdT=Math.max(1,+this.value||40);save();render()"></label>
<p class="m">ACCA members need 40 units a year, 21 of them verifiable.</p>
<h3>Backup &amp; recovery</h3>
<p class="m">Your records live on this device, in your Google Sheet when connected, and in daily Drive backups (last 40 kept).</p>
<div class="r"><span class="m">Daily Drive backup</span><b>${c.url?(c.bk?fd(c.bk):'After the next sync'):'Needs sync'}</b></div><div class="r"><span class="m">Last backup file</span><b>${c.lastExport?fd(c.lastExport):'Never'}</b></div><div class="r"><span class="m">Records</span><b>${D.items.filter(i=>!i.deleted).length}</b></div>
<div class="btns mt"><button class="btn sm" onclick="exp()">⬇ Export file</button><button class="btn sm" onclick="$('#imp').click()">⬆ Import file</button><button class="btn sm" onclick="rbList()" ${c.url?'':'disabled'}>☁ Restore from Drive</button></div>
<div id="rbOut"></div>
<h3>Logs</h3><p class="m">${LOG.length?LOG.length+' problem'+(LOG.length>1?'s':'')+' recorded on this device. Script errors also go to the Log tab of your Google Sheet.':'No problems recorded. 👍'}</p>
${lg.map(x=>`<div class="logline">${new Date(x.t).toLocaleString('en-GB')} · ${E(x.a)} · ${E(x.m)}</div>`).join('')}
${LOG.length>4?`<button class="btn sm mt" onclick="LOGALL=!LOGALL;openSettings()">${LOGALL?'Show less':'Show all'}</button>`:''}${LOG.length?' <button class="btn sm mt" onclick="LOG=[];kv(\'put\',\'log\',[]);openSettings()">Clear</button>':''}
<h3>About</h3><p class="m">NextRole ${APP_V}${c.sv?' · script v'+c.sv+(c.sv<CODE_V?' (update Code.gs)':''):''}</p>
<div class="btns" style="margin-top:20px"><button class="btn" style="flex:1" onclick="$('#st').close()">Close</button></div>`;
if(!d.open){d.showModal();pushTab()}d.scrollTop=y}
async function saveConn(){const u=$('#s_url').value.trim(),t=$('#s_tok').value.trim();if(u&&!okUrl(u))return alert('That link does not look right. It should start with https://script.google.com/macros/s/ and end with /exec');
D.cfg.url=u;D.cfg.token=t;D.cfg.fails=0;D.cfg.lastErr='';await save();syIdle();openSettings();if(u)await sync(1);openSettings()}
const EYEI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
EYEO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
// show / hide a secret field
function pwSet(b,on){const i=b.parentNode.querySelector('input');i.type=on?'text':'password';b.innerHTML=on?EYEO:EYEI;b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Hide':'Show')}
function pwT(b){const i=b.parentNode.querySelector('input'),on=i.type==='password';pwSet(b,on);i.focus({preventScroll:true});try{const n=i.value.length;i.setSelectionRange(n,n)}catch(e){}}
function mkTok(){const a=new Uint8Array(18);crypto.getRandomValues(a);const t=btoa(String.fromCharCode(...a)).replace(/[+/=]/g,'').slice(0,24);$('#s_tok').value=t;pwSet($('#s_tok').parentNode.querySelector('.eye'),1);
navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Copied. Paste it into TOKEN in Code.gs')).catch(()=>{})}
async function diag(){const o=$('#diagOut');o.innerHTML='<p class="m">Checking…</p>';try{const h=await api({action:'health'}),ok=(b,t)=>`<div class="r"><span>${b?'✅':'⚠️'} ${t}</span></div>`;
o.innerHTML='<div class="c">'+ok(1,'Connected · script v'+h.v+(h.v<CODE_V?' (newer Code.gs available)':''))+ok(1,'Sheet: <a href="'+E(h.sheet.url)+'" target="_blank" rel="noopener" style="color:var(--cy)">'+E(h.sheet.name)+'</a> · '+h.sheet.rows+' rows')+
ok(!!h.backups,'Drive backups'+(h.backups?' · last '+E(h.backups.last||'—'):' · after first sync'))+ok(!D.cfg.cal||h.calendar,'Calendar'+(D.cfg.cal?(h.calendar?' ready':' not created yet'):' off'))+ok(!h.errors,h.errors?h.errors+' errors in the Log tab':'No script errors')+'</div>'}
catch(e){o.innerHTML='<p class="m s2">Check failed: '+E(e.message)+'</p>'}}
async function rbList(){const o=$('#rbOut');o.innerHTML='<p class="m">Loading backups…</p>';try{const j=await api({action:'backups'});
o.innerHTML=j.backups.length?'<div class="c">'+j.backups.map(b=>`<div class="pc" onclick="rbGet('${E(b.fid)}','${E(b.name)}')"><div style="flex:1">${E(b.name.replace('ladder-backup-','').replace('.json',''))}</div><span class="m">${Math.round(b.size/1024)} KB</span></div>`).join('')+'</div>':'<p class="m">No backups yet.</p>'}catch(e){o.innerHTML='<p class="m s2">'+E(e.message)+'</p>'}}
async function rbGet(fid,name){if(!confirm('Restore records from '+name+'? They will replace the current versions. A safety backup is made first.'))return;
try{await api({action:'snap'});const j=await api({action:'getbackup',fid}),b=JSON.parse(j.data),now=Date.now();merge((b.items||[]).map(i=>({...i,updated:now})));await save();render();await sync(1);openSettings();toast('Restored '+(b.items||[]).length+' records')}
catch(e){alert('Could not restore: '+e.message)}}
async function exp(){const b=new Blob([JSON.stringify({v:1,app:'Ladder',items:D.items})],{type:'application/json'}),f=new File([b],'ladder-backup-'+today()+'.json',{type:'application/json'});
const okx=()=>{D.cfg.lastExport=today();save();toast('Backup file ready')};try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});okx();return}}catch(e){if(e.name==='AbortError')return;logE('export',e)}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();okx()}
async function imp(inp){const f=inp.files[0];if(!f)return;try{const j=JSON.parse(await f.text());let list=j.items;if(!Array.isArray(list)&&j.acca)list=fromV1(j);if(!Array.isArray(list))throw new Error('no records found in the file');
merge(list);commit();toast('Imported '+list.length+' records')}catch(e){logE('import',e);alert('Could not import that file: '+e.message+'. Pick a NextRole (or older Ladder) backup .json file.')}inp.value=''}

// ---------- swipe between tabs: the page follows your finger, the next tab slides in beside it, then snaps ----------
(()=>{const T=TABS,m=document.querySelector('main'),v=$('#v');let S=null;
const reset=()=>{if(!S)return;[v,S.pp,S.pn].forEach(e=>{if(e){e.style.transition='';e.style.transform=''}});if(S.pp)S.pp.remove();if(S.pn)S.pn.remove();m.classList.remove('swp');S=null};
const panel=t=>{if(!t)return null;const d=document.createElement('div');d.className='w swpan';d.setAttribute('aria-hidden','true');d.inert=true;d.innerHTML=viewOf(t);d.style.top=Math.max(0,scrollY-m.offsetTop)+'px';m.appendChild(d);return d};
const place=dx=>{const W=S.w+24;v.style.transform=`translate3d(${dx}px,0,0)`;if(S.pp)S.pp.style.transform=`translate3d(${dx-W}px,0,0)`;if(S.pn)S.pn.style.transform=`translate3d(${dx+W}px,0,0)`};
document.addEventListener('touchstart',e=>{if(S&&S.anim)return;reset();const t=e.touches[0];if(e.touches.length>1||document.querySelector('dialog[open]')||e.target.closest('header,nav,dialog,#fab,#fm,#toast,input,select,textarea,.seg,.dots,.paper,summary'+(innerWidth<760?',.fr':''))||(window.visualViewport&&visualViewport.scale>1.01))return;
S={x:t.clientX,y:t.clientY,lock:0,dx:0,h:[[t.clientX,performance.now()]]}},{passive:true});
document.addEventListener('touchmove',e=>{if(!S||S.anim)return;if(e.touches.length>1){if(S.lock){S.anim=1;place(0);setTimeout(reset,0)}else S=null;return}const t=e.touches[0],dx=t.clientX-S.x,dy=t.clientY-S.y;
if(!S.lock){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;if(Math.abs(dy)*1.1>=Math.abs(dx)){S=null;return}S.lock=1;S.i=T.indexOf(tab);S.w=v.offsetWidth;S.pp=panel(T[S.i-1]);S.pn=panel(T[S.i+1]);m.classList.add('swp');fab(0);S.x=t.clientX-dx}
S.h.push([t.clientX,performance.now()]);if(S.h.length>5)S.h.shift();let d=dx;if((d>0&&!S.pp)||(d<0&&!S.pn))d/=3.5;S.dx=d;place(d)},{passive:true});
const end=()=>{if(!S)return;if(!S.lock||S.anim){if(!S.anim)S=null;return}const h=S.h,a=h[0],b=h[h.length-1],vel=(b[0]-a[0])/Math.max(1,b[1]-a[1]),d=S.dx,W=S.w+24,
dir=d<0&&S.pn&&(d<-S.w*.28||vel<-.35)?1:d>0&&S.pp&&(d>S.w*.28||vel>.35)?-1:0,ms=dir?Math.round(Math.min(320,Math.max(160,(W-Math.abs(d))/Math.max(1.2,Math.abs(vel))))):220;S.anim=1;
[v,S.pp,S.pn].forEach(e=>{if(e)e.style.transition=`transform ${ms}ms cubic-bezier(.2,.8,.2,1)`});place(dir?-dir*W:0);
setTimeout(()=>{const nt=dir?T[S.i+dir]:null;reset();if(nt){go(nt,0,1);buzz(6)}},ms+20)};
document.addEventListener('touchend',end,{passive:true});document.addEventListener('touchcancel',end,{passive:true})})();

// ---------- start ----------
// #add-win / #add-learning shortcuts from the home-screen icon
const quickAdd=h=>{if(h!=='add-win'&&h!=='add-learning')return 0;SEG.journal=h==='add-win'?'win':'cpd';go('journal',1);openE(SEG.journal);return 1};
addEventListener('popstate',()=>{const d=document.querySelector('dialog[open]');if(d){d.close();return}const h=location.hash.slice(1);
if(!quickAdd(h)&&isTab(h)&&h!==tab)go(h,1)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')return fab(0);
if(e.metaKey||e.ctrlKey||e.altKey||dlgOpen()||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||''))return;
const k=e.key.toLowerCase();
if(/^[1-5]$/.test(k))go(TABS[+k-1]);else if(k==='g')openE('goal');else if(k==='w')openE('win');else if(k==='l')openE('cpd');else if(k==='n')fab();else if(k===',')openSettings();else return;e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;FLD=1;if(!dlgOpen())render();flowPull();if(D.cfg.url&&Date.now()-(D.cfg.lastAt||0)>60000)sync()});
addEventListener('online',()=>{if(D.cfg.url)sync()});
addEventListener('storage',e=>{if(e.key!=='flow2.db')return;FLD=1;if(!dlgOpen())render()});
load().then(()=>{const h=location.hash.slice(1);if(isTab(h))tab=h;render();syIdle();quickAdd(h);
if(D.cfg.url)sync();flowPull()});
if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const w=r.installing;if(w)w.onstatechange=()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('A new version of NextRole is ready',()=>location.reload(),'Reload')}}}).catch(e=>logE('app','Offline support could not start: '+e.message))}
</script>
